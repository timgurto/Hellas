name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate version header
        run: echo '#define VERSION "ci"' > src/version.h

      - name: Build tests
        run: msbuild Hellas.sln /t:test /p:Configuration=Debug /verbosity:minimal

      - name: Set up runtime DLLs
        run: |
          Remove-Item msvcp140.dll, msvcr110.dll, vcruntime140.dll
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vsPath\VC\Redist" -Recurse -Filter "msvcp140d.dll" | Where-Object { $_.FullName -match 'x86' -and $_.FullName -match 'VC143' } | Select-Object -First 1
          Copy-Item "$($crt.DirectoryName)\*" . -Force
          Copy-Item "C:\Windows\SysWOW64\ucrtbased.dll" . -Force

      - name: Run tests
        run: .\test-debug.exe
