name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate version header
        run: echo '#define VERSION "ci"' > src/version.h

      - name: Build tests
        run: msbuild Hellas.sln /t:test /p:Configuration=Debug /verbosity:minimal

      - name: Check DLL dependencies
        run: dumpbin /dependents .\test-debug.exe

      - name: List DLLs in repo root
        run: Get-ChildItem .\*.dll | Select-Object Name

      - name: Run tests
        run: .\test-debug.exe
