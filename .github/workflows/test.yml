name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate version header
        run: echo '#define VERSION "ci"' > src/version.h

      - name: Build tests
        run: msbuild Hellas.sln /t:test /p:Configuration=Debug /verbosity:minimal

      - name: Diagnose
        run: |
          python -c "
          import struct, subprocess, ctypes, os
          # Check exe architecture
          with open('test-debug.exe', 'rb') as f:
              f.seek(60)
              pe = struct.unpack('<I', f.read(4))[0]
              f.seek(pe + 4)
              m = struct.unpack('<H', f.read(2))[0]
              arch = {0x14C: 'x86', 0x8664: 'x64'}.get(m, hex(m))
              print(f'test-debug.exe: {arch}')
          # Try running and capture error
          r = subprocess.run(['test-debug.exe', '--list-tests'], capture_output=True, timeout=10)
          print(f'exit code: {r.returncode}')
          print(f'stdout: {r.stdout[:200]}')
          print(f'stderr: {r.stderr[:500]}')
          "
