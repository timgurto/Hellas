name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate version header
        run: echo '#define VERSION "ci"' > src/version.h

      - name: Build tests
        run: msbuild Hellas.sln /t:test /p:Configuration=Debug /verbosity:minimal

      - name: List DLLs present
        run: Get-ChildItem .\*.dll | Select-Object Name, Length

      - name: Try running tests
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath .\test-debug.exe -ArgumentList "--list-tests" -Wait -PassThru -NoNewWindow
          Write-Output "Exit code: $($p.ExitCode)"

      - name: Check event log for errors
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=1,2; StartTime=(Get-Date).AddMinutes(-5)} -MaxEvents 10 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message
